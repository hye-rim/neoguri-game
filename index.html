<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>너구리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html, body {
    width:100%; height:100%; overflow:hidden; touch-action:none;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.06) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #2a2466 0%, #1a1440 100%);
    font-family:'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:var(--ink);
  }
  #stage { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:10px; }
  /* 3:4 비율을 지키며 화면에 맞춘다 (예전엔 폭이 좁으면 높이는 그대로라 게임이 세로로 늘어났다) */
  #wrap { position:relative; width:min(100%, calc((100dvh - 30px) * .75)); aspect-ratio:3/4; }
  #game {
    display:block; width:100%; height:100%; border-radius:22px;
    box-shadow:0 0 0 4px var(--ink), 0 8px 0 4px var(--ink), 0 20px 40px rgba(0,0,0,.4);
  }
  /* 터치 버튼은 게임 아래에 (게임 화면 맨 아래 층을 가리지 않게). 마우스·키보드 환경에선 숨김 */
  #controls { display:none; width:100%; max-width:420px; justify-content:space-between; align-items:flex-end; padding:0 6px; }
  @media (pointer: coarse) {
    #controls { display:flex; }
    #wrap { width:min(100%, calc((100dvh - 170px) * .75)); }
  }
  .pad { display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px); gap:6px; pointer-events:auto; }
  .btn {
    touch-action:none; background:rgba(255,255,255,.92); color:var(--ink);
    border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink);
    font-size:20px; font-family:inherit;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); background:var(--yellow); }
  #jump { pointer-events:auto; width:86px; height:86px; border-radius:50%; background:var(--yellow); font-size:21px; box-shadow:0 6px 0 var(--ink); }
  #jump:active { box-shadow:0 2px 0 var(--ink); transform:translateY(4px); }
  #up { grid-column:2; grid-row:1; } #left { grid-column:1; grid-row:2; } #down { grid-column:2; grid-row:2; } #right { grid-column:3; grid-row:2; }

  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:16px;
    text-align:center; padding:22px; overflow-y:auto;
    background:rgba(43,29,82,.55); backdrop-filter:blur(3px); border-radius:22px;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:clamp(42px, 12vw, 58px); font-weight:400; line-height:1; color:#fff;
    paint-order:stroke fill; -webkit-text-stroke:7px var(--ink); text-shadow:0 6px 0 var(--ink);
  }
  #overlay p {
    font-size:15px; line-height:1.75; max-width:340px;
    background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink);
    padding:12px 16px;
  }
  #startBtn {
    padding:11px 44px; font-size:24px; font-family:inherit; color:var(--ink);
    background:var(--yellow); border:3px solid var(--ink); border-radius:999px; box-shadow:0 6px 0 var(--ink); cursor:pointer;
  }
  #startBtn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1 id="title">🦝 너구리</h1>
    <p id="msg">사다리를 오르내리며 층마다 놓인 음식을 모두 먹으세요!<br>🐛 지네와 📌 압정, 🐍 뱀을 조심!<br>❓ 항아리는 보너스 또는 뱀이 나와요<br>← → ↑ ↓ 이동, Space(점프 버튼)로 점프!<br>끊어진 바닥은 점프로 건너세요 (빠지면 -5초)<br>점프하면 압정과 지네도 넘을 수 있어요</p>
    <button id="startBtn">게임 시작</button>
  </div>
</div>
  <div id="controls">
    <div class="pad">
      <button class="btn" id="up">▲</button><button class="btn" id="left">◀</button><button class="btn" id="down">▼</button><button class="btn" id="right">▶</button>
    </div>
    <button class="btn" id="jump">점프</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
